<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ara hero: mashrabiya light</title>
<style>
  body { margin: 0; font-family: var(--font-sans, system-ui, sans-serif); }
  .hero { position: relative; height: 470px; overflow: hidden; border-radius: var(--radius, 12px); background: #050505; padding: 16px; box-sizing: border-box; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .copy { position: absolute; left: 32px; top: 50%; transform: translateY(-38%); color: #f5f5f5; }
  .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #b8c6e8; padding: 4px 10px 4px 8px; border: 1px solid #ffffff1f; border-radius: 99px; background: #0a0a0a80; backdrop-filter: blur(6px); }
  .kicker i { width: 7px; height: 7px; background: #346bf1; transform: rotate(45deg); border-radius: 1px; }
  h1 { margin: 14px 0 0; font-size: 58px; line-height: .98; letter-spacing: -0.045em; font-weight: 600; text-shadow: 0 2px 30px #000a; }
  .nav { position: absolute; top: 16px; left: 24px; right: 24px; display: flex; align-items: center; gap: 22px; color: #c9c9c9; font-size: 12.5px; }
  .nav b { display: flex; align-items: center; gap: 7px; color: #f5f5f5; font-size: 17px; letter-spacing: -0.04em; margin-right: 8px; }
  .nav .dl { margin-left: auto; background: #346bf1; color: #fff; padding: 6px 12px; border-radius: 7px; font-weight: 500; }
</style>
</head>
<body>
<div class="hero">
  <canvas id="c"></canvas>
  <div class="nav">
    <b><svg viewBox="0 0 64 64" width="20" height="20"><path fill="#f5f5f5" d="M6 60 L32 22 L58 60 L45 60 L28.5 35.9 L12 60 Z"/><path fill="#346bf1" d="M32 4 L38 10 L32 16 L26 10 Z"/></svg>Ara</b>
    <span>Engine</span><span>Agents</span><span>Scripting</span><span>Benchmarks</span><span>Docs</span>
    <span class="dl">Download</span>
  </div>
  <div class="copy">
    <span class="kicker"><i></i>0.0.1-alpha · first public alpha</span>
    <h1>An AI-native<br>game engine.</h1>
  </div>
</div>
<script>
// Light through a mashrabiya: a lattice screen on the right wall whose openings each
// hold a nuqta. One analytic ray per pixel, plus a short volumetric march for the shafts.
const FRAG = `
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uMouse;

const float SCREEN_X = 3.2;             // the lattice plane (right wall)
const vec3 LIGHT_COL = vec3(0.62, 0.75, 1.0);

float hash(vec2 p) { return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }

// 1 where light passes the lattice at (z, y) on the screen plane, 0 on the wood.
// Rhombus cells, each with a small solid nuqta in its centre.
float lattice(vec2 p, float blur) {
  vec2 q = vec2(p.x / 0.36 + p.y / 0.62, p.x / 0.36 - p.y / 0.62);
  vec2 f = abs(fract(q) - 0.5);
  float m = max(f.x, f.y);
  float open = smoothstep(0.405 + blur, 0.405 - blur, m);       // bars between cells
  float nuqta = smoothstep(0.13 - blur, 0.13 + blur, m);        // the dot in each cell
  return open * nuqta;
}

// The window the screen sits in: z in [-1.5, 7], y in [0.3, 3.6].
float window(vec2 p, float blur) {
  vec2 lo = smoothstep(vec2(-1.5, 0.3) - blur, vec2(-1.5, 0.3) + blur, p);
  vec2 hi = smoothstep(vec2(7.0, 3.6) + blur, vec2(7.0, 3.6) - blur, p);
  return lo.x * lo.y * hi.x * hi.y;
}

vec3 lightDir() {
  float t = uTime * 0.035;
  return normalize(vec3(1.0, 0.95 + 0.08 * sin(t), 0.30 + 0.25 * sin(t * 0.7)));
}

// How much sunlight reaches point p through the screen.
float visibility(vec3 p, vec3 L) {
  if (p.x >= SCREEN_X) return 0.0;
  float t = (SCREEN_X - p.x) / L.x;
  vec2 s = (p + L * t).zy;
  float blur = 0.004 + t * 0.012;   // penumbra widens with distance from the lattice
  return lattice(s, blur) * window(s, blur * 2.0);
}

vec3 aces(vec3 x) {
  return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  vec3 ro = vec3(-0.9 + uMouse.x * 0.25, 1.5 - uMouse.y * 0.12, -3.8);
  vec3 target = vec3(0.7, 0.85, 4.0);
  vec3 fw = normalize(target - ro);
  vec3 rt = normalize(cross(vec3(0, 1, 0), fw));
  vec3 up = cross(fw, rt);
  vec3 rd = normalize(fw * 1.35 + uv.x * rt + uv.y * up);
  vec3 L = lightDir();

  // Scene: floor y=0, back wall z=7, the screen wall x=SCREEN_X, ceiling y=4.
  float tHit = 1e5; vec3 n = vec3(0); int id = 0;
  if (rd.y < 0.0) { float t = -ro.y / rd.y; if (t < tHit) { tHit = t; n = vec3(0,1,0); id = 1; } }
  if (rd.z > 0.0) { float t = (7.0 - ro.z) / rd.z; if (t < tHit) { tHit = t; n = vec3(0,0,-1); id = 2; } }
  if (rd.x > 0.0) { float t = (SCREEN_X - ro.x) / rd.x; if (t < tHit) { tHit = t; n = vec3(-1,0,0); id = 3; } }
  if (rd.y > 0.0) { float t = (4.0 - ro.y) / rd.y; if (t < tHit) { tHit = t; n = vec3(0,-1,0); id = 4; } }
  vec3 p = ro + rd * tHit;

  vec3 col = vec3(0.0);
  if (id == 3) {
    // Looking at the screen from inside: the openings glow with the sky behind them.
    vec2 s = p.zy;
    float blur = 0.006;
    float glow = lattice(s, blur) * window(s, blur);
    float halo = lattice(s, 0.22) * window(s, 0.4);
    col = LIGHT_COL * (glow * 1.05 + halo * 0.22) + vec3(0.006, 0.006, 0.008);
  } else {
    float v = visibility(p + n * 0.001, L);
    float ndl = max(dot(n, L), 0.0);
    vec3 albedo = id == 1 ? vec3(0.20, 0.20, 0.22) : vec3(0.13, 0.13, 0.145);
    // Soft bounce: the lit pool, heavily blurred, fills the room a little (cheap GI).
    float pool = window((p + L * ((SCREEN_X - p.x) / L.x)).zy, 1.2) * step(p.x, SCREEN_X);
    col = albedo * (LIGHT_COL * (v * ndl * 1.55) + LIGHT_COL * pool * 0.06 + vec3(0.004, 0.005, 0.009));
  }

  // Volumetric shafts: march the view ray and gather light that got through the screen.
  const int STEPS = 48;
  float maxT = min(tHit, 16.0);
  float dt = maxT / float(STEPS);
  float jitter = hash(gl_FragCoord.xy + fract(uTime) * 61.0);
  float cosT = dot(rd, L);
  float g = 0.55;
  float phase = (1.0 - g * g) / pow(1.0 + g * g - 2.0 * g * cosT, 1.5) * 0.08;
  float scatter = 0.0;
  for (int i = 0; i < STEPS; i++) {
    vec3 s = ro + rd * (float(i) + jitter) * dt;
    float dust = 0.75 + 0.25 * sin(s.x * 3.1 + uTime * 0.21) * sin(s.z * 2.3 - uTime * 0.17);
    scatter += visibility(s, L) * dust;
  }
  col += LIGHT_COL * scatter * dt * phase * 0.44 + vec3(0.10, 0.22, 0.75) * scatter * dt * 0.0022;

  col = aces(col * 0.95);
  col = pow(col, vec3(1.0 / 2.2));
  float vig = smoothstep(1.25, 0.35, length(uv * vec2(0.9, 1.1)));
  col *= mix(0.55, 1.0, vig);
  col += (hash(gl_FragCoord.xy + uTime) - 0.5) * 0.018;
  gl_FragColor = vec4(col, 1.0);
}`;

const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { antialias: false });
const shader = (type, src) => {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
};
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p, 0, 1); }"));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0);
gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
const uRes = gl.getUniformLocation(prog, "uRes");
const uTime = gl.getUniformLocation(prog, "uTime");
const uMouse = gl.getUniformLocation(prog, "uMouse");
const mouse = { x: 0, y: 0 };
addEventListener("pointermove", (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = (e.clientY / innerHeight) * 2 - 1;
});
const start = performance.now();
function frame(now) {
  const dpr = Math.min(devicePixelRatio, 1.5);
  const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; gl.viewport(0, 0, w, h); }
  gl.uniform2f(uRes, w, h);
  gl.uniform1f(uTime, 40 + (now - start) / 1000);
  gl.uniform2f(uMouse, mouse.x, mouse.y);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
