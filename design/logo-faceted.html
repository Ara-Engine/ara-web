<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ara logo, round 3: faceted (flat marks that read as 3D)</title>
<style>
  body { margin: 0; font: 13px/1.5 var(--font-sans, system-ui, sans-serif); }
  .sheet { display: grid; gap: 14px; }
  .card { display: grid; grid-template-columns: 200px 1fr; gap: 18px; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--card); }
  .big { display: grid; place-items: center; aspect-ratio: 1; border-radius: 10px; background: #0a0a0a; border: 1px solid #1e1e1e; }
  .big svg { width: 132px; height: 132px; }
  h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--foreground); }
  h3 small { margin-left: 8px; font-weight: 400; color: var(--muted-foreground); font-size: 12px; }
  p { margin: 4px 0 12px; color: var(--muted-foreground); max-width: 440px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; }
  .dark { background: #0a0a0a; border: 1px solid #1e1e1e; }
  .light { background: #f5f5f5; }
  .tile { width: 44px; height: 44px; border-radius: 11px; display: grid; place-items: center; background: linear-gradient(135deg, #4a7cf5, #1b4ed8); }
  .tile svg { width: 28px; height: 28px; }
  .lockup { display: flex; align-items: center; gap: 9px; padding: 9px 14px; border-radius: 8px; background: #0a0a0a; border: 1px solid #1e1e1e; font: 600 24px/1 var(--font-sans, system-ui); letter-spacing: -0.04em; color: #f5f5f5; }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
// Flat marks that read as 3D, the way Unity's cube does: planes in different tones,
// separated by clean cuts. Everything is on the 64-unit grid used by the other studies.

const pts = (p) => p.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(" ");
const poly = (p, fill) => `<polygon points="${pts(p)}" fill="${fill}"/>`;

/** A nuqta seen as a crystal: four facets meeting at the centre, cut apart by `g`. */
function gem(cx, cy, hx, hy, g, [tl, tr, bl, br]) {
  const ex = (hx * g) / (2 * hy), ey = (hy * g) / (2 * hx), h = g / 2;
  return [
    poly([[cx - hx + ex, cy - h], [cx - h, cy - hy + ey], [cx - h, cy - h]], tl),
    poly([[cx + h, cy - hy + ey], [cx + hx - ex, cy - h], [cx + h, cy - h]], tr),
    poly([[cx - hx + ex, cy + h], [cx - h, cy + h], [cx - h, cy + hy - ey]], bl),
    poly([[cx + h, cy + h], [cx + hx - ex, cy + h], [cx + h, cy + hy - ey]], br),
  ].join("");
}

/** A nuqta as a half-lit crystal: a lit left half and a shaded right half, cut down the middle. */
function halfGem(cx, cy, hx, hy, g, [lit, , , shade]) {
  const h = g / 2;
  return poly([[cx - h, cy - hy + (hy * h) / hx], [cx - h, cy + hy - (hy * h) / hx], [cx - hx, cy]], lit)
    + poly([[cx + h, cy - hy + (hy * h) / hx], [cx + hx, cy], [cx + h, cy + hy - (hy * h) / hx]], shade);
}

const shift = (p, [dx, dy]) => p.map(([x, y]) => [x + dx, y + dy]);

// Palettes: [light, mid-light, mid, dark] for facets lit from the top left.
const BLUE = ["#a9c1ff", "#6a95ff", "#346bf1", "#1a43b8"];
const SILVER = ["#f5f5f5", "#c4cad6", "#8e96a8", "#575e6e"];
const INK = ["#3d3d44", "#26262c", "#17171b", "#0a0a0a"];
const MONO = (c) => [c, c, c, c];

const marks = {
  /** The Alif as two folded planes (a ridge from the apex), with a crystal nuqta above. */
  alif(body, nuqta, g = 1.6) {
    const n = [0.97, 0.244]; // perpendicular to the fold line (32,22)→(28.5,35.9)
    const left = shift([[6, 60], [32, 22], [28.5, 35.9], [12, 60]], [-n[0] * g / 2, -n[1] * g / 2]);
    const right = shift([[32, 22], [58, 60], [45, 60], [28.5, 35.9]], [n[0] * g / 2, n[1] * g / 2]);
    return poly(left, body[0]) + poly(right, body[2]) + gem(32, 10, 6.5, 6.5, g, nuqta);
  },

  /** The A built only from nuqta crystals; one blue crystal is the crossbar. */
  lattice(body, nuqta, g = 1.1) {
    const centres = [[32, 12.5], [27, 21], [37, 21], [22, 29.5], [42, 29.5], [17, 38], [47, 38], [12, 46.5], [52, 46.5], [7, 55], [57, 55]];
    return centres.map(([x, y]) => halfGem(x, y, 3.9, 6.7, g, body)).join("") + halfGem(32, 46.5, 3.9, 6.7, g, nuqta);
  },

  /** The monument: the solid Alif body with depth to the right, a mashrabiya carved through it. */
  monument(body, nuqta, g = 1.4) {
    const front = [[4, 62], [30, 22], [56, 62], [37, 62], [30, 48], [23, 62]];
    const d = [5, -3.5];
    // Side faces that face the light-away direction, drawn under the front face.
    const side = (a, b) => poly([a, b, [b[0] + d[0], b[1] + d[1]], [a[0] + d[0], a[1] + d[1]]], body[3]);
    const holes = [];
    for (let j = 0; j < 12; j++) for (let i = 0; i < 16; i++) {
      const cx = i * 4 + (j % 2 ? 2 : 0), cy = 26 + j * 3.2, hx = 1.15, hy = 1.9;
      const inside = (x, y) => {
        // Inside the outer triangle by a margin, and outside the arch counter.
        const l = (y - 22) / 40 * 26, inTri = y < 59 && Math.abs(x - 30) < l - 3.2;
        const arch = y > 44 && Math.abs(x - 30) < ((y - 48) / 14) * 7 + 3.6;
        return inTri && !arch;
      };
      if ([[cx, cy - hy], [cx + hx, cy], [cx, cy + hy], [cx - hx, cy]].every(([x, y]) => inside(x, y))) {
        holes.push(`M${cx},${cy - hy} L${cx + hx},${cy} L${cx},${cy + hy} L${cx - hx},${cy} Z`);
      }
    }
    const frontPath = `M${front.map(([x, y]) => `${x},${y}`).join(" L")} Z ${holes.join(" ")}`;
    return side([30, 22], [56, 62]) + side([23, 62], [30, 48])
      + `<path fill-rule="evenodd" fill="${body[0]}" d="${frontPath}"/>`
      + gem(30 + d[0] / 2, 9.5, 6.2, 6.2, g, nuqta);
  },

  /** The nuqta alone as a primitive, the way Unity uses a cube. */
  nuqta(_body, nuqta, g = 3) {
    return gem(32, 32, 26, 30, g, nuqta);
  },
};

const concepts = [
  { id: "alif", name: "Alif, faceted", sub: "folded planes + crystal nuqta",
    text: "The Alif you picked, built from planes: the ridge from the apex splits a lit face from a shaded one, and the nuqta becomes a crystal. Flat to print, 3D to read.",
    dark: [SILVER, BLUE], light: [INK, BLUE], mono: "#f5f5f5", tile: [MONO("#fff"), MONO("#fff")] },
  { id: "lattice", name: "Lattice crystal", sub: "the A in nuqtas",
    text: "The crystal render as a flat mark: eleven nuqtas, each half lit and half in shadow, make the A; the twelfth (blue) is its crossbar. Also a pattern system for the site.",
    dark: [SILVER, BLUE], light: [INK, BLUE], mono: "#f5f5f5", tile: [MONO("#fff"), MONO("#0b1f5c")] },
  { id: "monument", name: "Monument", sub: "solid Alif, mashrabiya carved through",
    text: "The monument as a flat mark: one solid face, a shaded side for depth, the lattice cut through it, the crystal nuqta above. The richest of the set.",
    dark: [SILVER, BLUE], light: [INK, BLUE], mono: "#f5f5f5", tile: [MONO("#fff"), MONO("#fff")] },
  { id: "nuqta", name: "Nuqta", sub: "the primitive",
    text: "Unity has the cube; Ara has the nuqta, the calligrapher's unit of measure, as a crystal. Works as favicon, app icon and loading glyph alongside any of the above.",
    dark: [SILVER, BLUE], light: [INK, BLUE], mono: "#f5f5f5", tile: [MONO("#fff"), ["#ffffff", "#dfe8ff", "#c3d4ff", "#a7c0ff"]] },
];

const svg = (inner, size) => `<svg viewBox="0 0 64 64"${size ? ` width="${size}" height="${size}"` : ""}>${inner}</svg>`;
const draw = (c, [body, nuqta], size) => svg(marks[c.id](body, nuqta), size);

document.getElementById("sheet").innerHTML = concepts.map((c) => `
  <div class="card">
    <div class="big">${draw(c, c.dark)}</div>
    <div>
      <h3>${c.name}<small>${c.sub}</small></h3>
      <p>${c.text}</p>
      <div class="row">
        <div class="chip dark">${[16, 24, 32, 48].map((s) => draw(c, c.dark, s)).join("")}</div>
        <div class="chip light">${[16, 24, 32, 48].map((s) => draw(c, c.light, s)).join("")}</div>
        <div class="chip dark">${[24, 40].map((s) => draw(c, [MONO(c.mono), MONO(c.mono)], s)).join("")}</div>
        <div class="tile">${draw(c, c.tile)}</div>
        <div class="lockup">${draw(c, c.dark, 28)}Ara</div>
      </div>
    </div>
  </div>`).join("");
</script>
</body>
</html>
